[project]
name = "permutados-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: requires PostgreSQL (TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311", "UP040"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"migrations/**" = ["E501"]
