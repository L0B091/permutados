# Memory is kept modest on purpose (the build box is shared). Raise on a workstation if needed.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Default backend URL baked into the build (can be changed on the login screen). Must be https:// for release.
permutados.apiBaseUrl=https://api.permutados.example/
