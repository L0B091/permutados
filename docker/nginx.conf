# Reference reverse proxy (TLS terminates here). Only the webhook and admin paths are exposed.
server {
    listen 443 ssl;
    server_name permutados.example.com;
    ssl_certificate     /etc/letsencrypt/live/permutados.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/permutados.example.com/privkey.pem;
    client_max_body_size 2m;

    location ~ ^/(webhooks|admin|health)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
